name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Ruff
        run: ruff check app tests
      - name: Mypy
        run: mypy app --no-error-summary || true
      - name: Unit tests
        run: pytest tests/unit tests/nodes tests/flows -q --tb=short
      - name: Smoke test (graph compiles)
        run: python -c "from app.rag.graph import compile_rag_graph; compile_rag_graph()"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --legacy-peer-deps
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
