name: Evaluation

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      benchmark:
        description: "Benchmark to run"
        type: choice
        options:
          - all
          - golden
          - cuad
          - legalbench_mini
          - contract_nli
        default: all

jobs:
  unit-eval-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Evaluation unit tests (no API key needed)
        run: pytest tests/evaluation -q --tb=short

  golden-eval:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.benchmark == 'all' || github.event.inputs.benchmark == 'golden'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: legal_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Golden QA evaluation (LLM-as-judge)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: anthropic
        run: python -c "
          import asyncio;
          from app.api.routes.evaluation import _run_golden_eval;
          asyncio.run(_run_golden_eval('ci-golden', None, True, 10, 'legal'))
          "

  cuad-eval:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.benchmark == 'all' || github.event.inputs.benchmark == 'cuad')
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: CUAD extractive QA evaluation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m data.scripts.run_cuad_eval --max-pairs 50 --output results/cuad_eval.json
        working-directory: ..
      - uses: actions/upload-artifact@v4
        with:
          name: cuad-results
          path: results/cuad_eval.json
        if: always()

  legalbench-eval:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.benchmark == 'all' || github.event.inputs.benchmark == 'legalbench_mini')
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: LegalBench-RAG retrieval benchmark (mini)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m data.scripts.run_legalbench_eval --mini --output results/legalbench_mini.json
        working-directory: ..
      - uses: actions/upload-artifact@v4
        with:
          name: legalbench-results
          path: results/legalbench_mini.json
        if: always()

  contractnli-eval:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.benchmark == 'all' || github.event.inputs.benchmark == 'contract_nli')
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: ContractNLI entailment evaluation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m data.scripts.run_contractnli_eval --max-pairs 100 --output results/nli_eval.json
        working-directory: ..
      - uses: actions/upload-artifact@v4
        with:
          name: contractnli-results
          path: results/nli_eval.json
        if: always()

  quality-gates:
    runs-on: ubuntu-latest
    needs: [unit-eval-tests]
    steps:
      - name: Quality gate summary
        run: |
          echo "=== Evaluation Quality Gates ==="
          echo "Golden (LLM-as-judge): faithfulness >= 0.80, answer_relevancy >= 0.80"
          echo "CUAD:                  token_f1 >= 0.30, recall@10 >= 0.40"
          echo "LegalBench-RAG:        recall@10 >= 0.30"
          echo "ContractNLI:           accuracy >= 0.50"
          echo "Latency:               P95 <= 3000ms (see check_latency.py)"
