apiVersion: v1
kind: Secret
metadata:
  name: {{ include "legal-rag.fullname" . }}-secrets
type: Opaque
stringData:
  postgres-password: {{ .Values.postgres.auth.password | default "change-me" | quote }}
  groq-api-key: {{ .Values.secrets.groqApiKey | default "change-me" | quote }}
  minio-access-key: {{ .Values.minio.auth.rootUser | default "minioadmin" | quote }}
  minio-secret-key: {{ .Values.minio.auth.rootPassword | default "minioadmin" | quote }}
