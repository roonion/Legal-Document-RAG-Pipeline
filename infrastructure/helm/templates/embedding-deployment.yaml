apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "legal-rag.fullname" . }}-embedding
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "legal-rag.name" . }}-embedding
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "legal-rag.name" . }}-embedding
    spec:
      containers:
        - name: embedding
          image: legal-rag-embedding:latest
          resources:
            limits:
              nvidia.com/gpu: "1"
