apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "legal-rag.fullname" . }}-frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "legal-rag.name" . }}-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "legal-rag.name" . }}-frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          ports:
            - containerPort: 3000
