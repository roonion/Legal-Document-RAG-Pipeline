{{- if .Values.monitoring.serviceMonitor.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "legal-rag.fullname" . }}-api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "legal-rag.name" . }}-api
  endpoints:
    - port: http
      path: /metrics
{{- end }}
