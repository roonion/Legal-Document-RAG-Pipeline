apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "legal-rag.fullname" . }}-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "legal-rag.name" . }}-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "legal-rag.name" . }}-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
