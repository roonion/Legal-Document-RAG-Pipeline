apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "legal-rag.fullname" . }}-celery
spec:
  replicas: {{ .Values.celery.workers.processing }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "legal-rag.name" . }}-celery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "legal-rag.name" . }}-celery
    spec:
      containers:
        - name: celery
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "processing", "-l", "info"]
