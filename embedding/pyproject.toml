[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-rag-embedding"
version = "0.1.0"
description = "BGE-M3 fine-tuning and ONNX/FastEmbed inference"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "fastembed>=0.4.0",
    "numpy>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
finetune = [
    "FlagEmbedding>=1.2.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
]
dev = ["pytest>=8.3.0", "ruff>=0.8.0"]

[tool.setuptools]
packages = ["finetune", "inference", "evaluation"]
